<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DEB3" />
      <stop offset="35%" stop-color="#E6C387" />
      <stop offset="70%" stop-color="#C98A3E" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3326" />
      <stop offset="100%" stop-color="#0E1813" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Inner Decorative Ring -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>

  <!-- Botanical Crown Leaves -->
  <path d="M 256 95 C 248 115 230 128 210 132 C 232 138 248 152 256 172 C 264 152 280 138 302 132 C 282 128 264 115 256 95 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="85" r="7" fill="url(#goldGrad)" />
  <circle cx="225" cy="115" r="4.5" fill="url(#goldGrad)" opacity="0.8" />
  <circle cx="287" cy="115" r="4.5" fill="url(#goldGrad)" opacity="0.8" />

  <!-- Monogram 'K' -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <!-- Vertical Stem -->
    <path d="M 195 185 L 225 185 L 225 365 L 195 365 Z" />
    <!-- Serifs on Stem -->
    <path d="M 180 185 L 240 185 L 240 196 L 180 196 Z" />
    <path d="M 180 354 L 240 354 L 240 365 L 180 365 Z" />
    
    <!-- Diagonal Up Leg -->
    <path d="M 225 285 L 305 185 L 335 185 L 250 290 Z" />
    <path d="M 290 185 L 345 185 L 345 195 L 290 195 Z" />

    <!-- Diagonal Down Leg -->
    <path d="M 242 278 L 320 365 L 355 365 L 268 268 Z" />
    <path d="M 305 354 L 365 354 L 365 365 L 305 365 Z" />
  </g>

  <!-- Stars / Accent Marks -->
  <path d="M 256 395 L 260 405 L 271 405 L 262 412 L 265 422 L 256 416 L 247 422 L 250 412 L 241 405 L 252 405 Z" fill="url(#goldGrad)" />
  <circle cx="220" cy="408" r="3" fill="url(#goldGrad)" opacity="0.7" />
  <circle cx="292" cy="408" r="3" fill="url(#goldGrad)" opacity="0.7" />
</svg>
